plugins {
    id 'fabric-loom' version '1.15.3'
    id 'maven-publish'
}

group = project.maven_group

// Version handling logic from original file
boolean isModVersionDefined = project.properties["mod_version"] == null ||
        project.properties["mod_version"].toString().length() == 0;

String modVer = isModVersionDefined
        ? "indev"
        : project.properties["mod_version"].toString()
project.setVersion("%s+%s".formatted(modVer, project.properties["minecraft_version"]))

loom {
    mods {
        asc {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir "run/client"
        }
        server {
            runDir "run/server"
        }
    }
}

repositories {
    mavenCentral()

    maven { url "https://maven.terraformersmc.com/releases/" }

    // Modrinth Maven (Fzzy Config)
    maven { url "https://api.modrinth.com/maven" }

    // Wisp Forest (Accessories)
    maven { url "https://maven.wispforest.io/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Accessories API (Critical dependency)
    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"

    // Fzzy Config (Config GUI + Config API)
    modImplementation "maven.modrinth:fzzy-config:${project.fzzy_config_version}"

    // Kotlin runtime support for Kotlin-based mods (Fzzy Config)
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    HashMap modifiedSrc = new HashMap<>(project.properties)
    filesMatching("fabric.mod.json") {
        expand modifiedSrc
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }

    if(project.properties["show_dev_warnings"] == "true") {
        it.options.deprecation = true
        it.options.compilerArgs << '-Xlint:unchecked'
    }
}

base {
    archivesName = project.archivesBaseName
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

static def formatAsBadgeSafe(var val) {
    if(!(val instanceof String))
        return val
    return ((String) val).replaceAll("[- /]", "_")
}
